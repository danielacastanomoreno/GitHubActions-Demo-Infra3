<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora — Grupo 3</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0a120c; color: #eef3ee;
           display: grid; place-items: center; min-height: 100vh; margin: 0; }
    main { background: #3e6845; border: 2px solid #2c5530; border-radius: 16px;
           padding: 32px; width: min(380px, 90vw); }
    h1 { color: #63cd66; margin-top: 0; }
    input, button { font-size: 1.1rem; padding: 8px 12px; border-radius: 8px; }
    input { width: 80px; background: #0a120c; color: #eef3ee; border: 1px solid #2c5530; }
    button { background: #3f7a41; color: #0a120c; border: none; font-weight: 700; cursor: pointer; }
    #resultado { font-size: 2rem; margin-top: 16px; min-height: 2.5rem; }
    small { color: #a3b0a4; }
  </style>
</head>
<body>
  <main>
    <h1>Calculadora</h1>
    <p>Publicada automáticamente con GitHub Actions</p>
    <input id="a" type="number" value="2">
    <input id="b" type="number" value="3">
    <p>
      <button onclick="calcular('sumar')">Sumar</button>
      <button onclick="calcular('dividir')">Dividir</button>
    </p>
    <div id="resultado"></div>
    <small>Versión: __VERSION__</small>
  </main>
  <script src="calculadora.js"></script>
  <script>
    function calcular(op) {
      const a = Number(document.getElementById('a').value);
      const b = Number(document.getElementById('b').value);
      try {
        const r = op === 'sumar' ? sumar(a, b) : dividir(a, b);
        document.getElementById('resultado').textContent = '= ' + r;
      } catch (e) {
        document.getElementById('resultado').textContent = e.message;
      }
    }
  </script>
</body>
</html>
