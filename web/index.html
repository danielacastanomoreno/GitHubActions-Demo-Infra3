<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora — Grupo 3</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0a120c; color: #eef3ee;
           display: grid; place-items: center; min-height: 100vh; margin: 0; }
    main { background: #111f13; border: 2px solid #2c5530; border-radius: 24px;
           padding: 56px; width: min(760px, 92vw); box-sizing: border-box; }
    h1 { color: #63cd66; margin-top: 0; font-size: 3.5rem; }
    p { font-size: 1.4rem; }
    input, button { font-size: 1.8rem; padding: 14px 20px; border-radius: 12px; }
    input { width: 160px; background: #0a120c; color: #eef3ee; border: 2px solid #2c5530; }
    button { background: #63cd66; color: #0a120c; border: none; font-weight: 700; cursor: pointer; }
    #resultado { font-size: 4rem; font-weight: 700; color: #63cd66; margin-top: 24px; min-height: 5rem; }
    small { color: #a3b0a4; font-size: 1.1rem; }
  </style>
</head>
<body>
  <main>
    <h1>Calculadora</h1>
    <p>Publicada automáticamente con GitHub Actions</p>
    <input id="a" type="number" value="2">
    <input id="b" type="number" value="3">
    <p>
      <button onclick="calcular('sumar')">Sumar</button>
      <button onclick="calcular('dividir')">Dividir</button>
    </p>
    <div id="resultado"></div>
    <small>Versión: __VERSION__</small>
  </main>
  <script src="calculadora.js"></script>
  <script>
    function calcular(op) {
      const a = Number(document.getElementById('a').value);
      const b = Number(document.getElementById('b').value);
      try {
        const r = op === 'sumar' ? sumar(a, b) : dividir(a, b);
        document.getElementById('resultado').textContent = '= ' + r;
      } catch (e) {
        document.getElementById('resultado').textContent = e.message;
      }
    }
  </script>
</body>
</html>
